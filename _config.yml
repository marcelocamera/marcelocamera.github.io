# ────────────────────────────────────────────────────────────
#  Configuração do blog
#  Edite os campos abaixo com seus dados.
# ────────────────────────────────────────────────────────────

title: "Marcelo"
tagline: "Gestão de Projetos de Software, Hardware, Firmware, Inteligência Artificial"
description: "Meu blog pessoal."
author: "Marcelo Camera"

# Troque pelo endereço real depois de publicar, ex:
#   https://seu-usuario.github.io          (se o repo se chamar seu-usuario.github.io)
#   https://seu-usuario.github.io/blog     (se o repo se chamar "blog")
url: "https://marcelocamera.github.io"
baseurl: ""

# Bio curta exibida na coluna lateral (aceita Markdown/links)
bio: >
  Voando (virtualmente) no Microsoft Flight Simulator, ouvindo muito rock, e fotografando o que aparece pela frente.
  \
  [Mais sobre mim →](/sobre/)

# Links sociais (deixe em branco "" para ocultar um item)
social:
  twitter: ""
  github: ""
  linkedin: "mcamera"
  email: "marcelo.camera@gmail.com"

# Google Analytics (GA4) — cole seu ID de medição (formato G-XXXXXXXXXX).
# Deixe em branco "" para desativar o analytics.
google_analytics: "G-263773400"

# ────────────────────────────────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /posts/:title/

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: atom.xml

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
