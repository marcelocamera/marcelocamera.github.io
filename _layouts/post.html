---
layout: default
---
<article class="post">
  <a class="back-link" href="{{ '/' | relative_url }}">◂ {{ site.title }}</a>

  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-date">
    {{ page.date | date: "%-d de %B de %Y" }}
    {% if page.tags.size > 0 %}
      <span class="post-tags">
        {% for tag in page.tags %}
          <a class="tag" href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">{{ tag }}</a>
        {% endfor %}
      </span>
    {% endif %}
  </p>

  <div class="post-body">
    {{ content }}
  </div>
</article>
