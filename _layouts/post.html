---
layout: default
---
<article class="post">
  <a class="back-link" href="{{ '/' | relative_url }}">◂ {{ site.title }}</a>

  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-date">{{ page.date | date: "%-d de %B de %Y" }}</p>

  <div class="post-body">
    {{ content }}
  </div>
</article>
